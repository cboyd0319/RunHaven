[workspace]
members = [
    "crates/runhaven",
    "crates/runhaven-cli",
    "crates/runhaven-core",
    "src-tauri",
]
exclude = ["crates/codex/*", "crates/codex/*/*", "crates/runhaven-tui"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
authors = ["Chad Boyd"]
repository = "https://github.com/cboyd0319/RunHaven"
homepage = "https://github.com/cboyd0319/RunHaven"

[workspace.dependencies]
anyhow = "=1.0.103"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
ansi-to-tui = "=8.0.1"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["bracketed-paste", "event-stream"] }
derive_more = { version = "=2.1.1", features = ["is_variant"] }
diffy = "=0.4.2"
dirs = "=6.0.0"
idna = "=1.1.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
insta = { version = "=1.48.0", default-features = false }
ipnet = "=2.12.0"
itertools = "=0.14.0"
lazy_static = "=1.5.0"
# Logging facade for the desktop shell's dev/test log trail (src-tauri). The
# tauri-plugin-log backend routes these records to stdout and the local app
# log file; log lines must never carry secrets, payloads, or terminal bytes.
# Logging facade for the desktop shell's local diagnostic trail.
log = "=0.4.33"
pathdiff = "=0.2.3"
pretty_assertions = "=1.4.1"
pty-process = "=0.5.3"
pulldown-cmark = "=0.10.3"
rand = { version = "=0.9.4", default-features = false, features = ["std", "std_rng"] }
ratatui = { version = "=0.30.2", features = ["scrolling-regions", "unstable-backend-writer", "unstable-widget-ref", "unstable-rendered-line-info"] }
regex = "=1.12.4"
regex-lite = "=0.1.8"
reqwest = { version = "=0.13.4", features = ["blocking"] }
rmcp = { version = "=1.8.0", default-features = false }
runhaven-cli = { path = "crates/runhaven-cli", version = "=0.7.0" }
runhaven-core = { path = "crates/runhaven-core", version = "=0.7.0" }
schemars = "=0.8.22"
# Type-enforced wrapper for explicitly configured host API keys. It redacts
# Debug, omits Display, and wipes its held copy on drop.
secrecy = "=0.10.3"
# Safe macOS CLI signal registration. The parent must reap its owned container
# process and finish marker/network cleanup after Ctrl-C, termination, or hangup.
signal-hook = "=0.4.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
serial_test = "=3.5.0"
sha2 = "=0.11.0"
shlex = "=1.3.0"
strum = "=0.27.2"
strum_macros = "=0.28.0"
supports-color = "=3.0.2"
syntect = "=5.3.0"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-dialog = "=2.7.1"
# Official Tauri v2 log plugin: writes app logs to stdout plus a rotated file
# under the app log dir, and exposes exactly one WebView command (`log`,
# write-only) behind the main-window-only `logging` capability. Local-only
# diagnostics; no network targets. Pinned to the current stable 2.8.0
# (crates.io, verified 2026-07-04).
tauri-plugin-log = "=2.8.0"
tauri-plugin-window-state = "=2.4.1"
tempfile = "=3.27.0"
textwrap = "=0.16.2"
time = { version = "=0.3.51", features = ["formatting", "parsing"] }
tokio = { version = "=1.52.3", features = ["macros", "rt", "sync", "test-util", "time"] }
tokio-stream = { version = "=0.1.18", features = ["sync"] }
tokio-util = { version = "=0.7.18", features = ["time"] }
toml = "=1.1.2"
tracing = "=0.1.44"
ts-rs = { version = "=11.1.0", features = ["no-serde-warnings", "serde-json-impl"] }
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
ureq = "=3.3.0"
url = "=2.5.8"
urlencoding = "=2.1.3"
uuid = { version = "=1.23.3", features = ["v4"] }
vt100 = "=0.16.2"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
