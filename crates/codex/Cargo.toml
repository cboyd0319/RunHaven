[workspace]
members = [
    "ansi-escape",
    "app-server-client",
    "app-server-protocol",
    "async-utils",
    "codex-api",
    "codex-client",
    "codex-experimental-api-macros",
    "config",
    "connectors",
    "context-fragments",
    "core",
    "core-skills",
    "exec-server",
    "exec-server-protocol",
    "execpolicy",
    "features",
    "feedback",
    "file-search",
    "file-system",
    "git-utils",
    "install-context",
    "memories/read",
    "model-provider-info",
    "models-manager",
    "network-proxy",
    "otel",
    "plugin",
    "protocol",
    "response-debug-context",
    "sandboxing",
    "shell-command",
    "terminal-detection",
    "utils/absolute-path",
    "utils/approval-presets",
    "utils/cache",
    "utils/cargo-bin",
    "utils/cli",
    "utils/elapsed",
    "utils/fuzzy-match",
    "utils/home-dir",
    "utils/image",
    "utils/output-truncation",
    "utils/path-uri",
    "utils/path-utils",
    "utils/plugins",
    "utils/pty",
    "utils/rustls-provider",
    "utils/sleep-inhibitor",
    "utils/stream-parser",
    "utils/string",
    "windows-sandbox-rs",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ansi-to-tui = "=8.0.1"
base64 = "=0.22.1"
clap = "=4.6.1"
pretty_assertions = "=1.4.1"
ratatui = "=0.30.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
tempfile = "=3.27.0"
toml = "=1.1.2"
tracing = "=0.1.44"

[workspace.lints.rust]

[workspace.lints.clippy]
