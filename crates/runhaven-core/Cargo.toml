[package]
name = "runhaven-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RunHaven runtime, provider, records, image, and shared contracts."

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
anyhow.workspace = true
idna.workspace = true
ipnet.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
toml.workspace = true
ureq.workspace = true
uuid.workspace = true

# macOS-only: the opt-in Keychain token store (RUNHAVEN_TOKEN_STORE=keychain).
# Target-gated so non-macOS builds never pull it. `security-framework` wraps the
# C Security API safely, so the store needs no `unsafe`.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
