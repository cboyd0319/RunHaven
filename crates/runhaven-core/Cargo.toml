[package]
name = "runhaven-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RunHaven runtime, provider, records, image, and shared contracts."

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
anyhow.workspace = true
idna.workspace = true
ipnet.workspace = true
pty-process.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
toml.workspace = true
ureq.workspace = true
uuid.workspace = true
zeroize.workspace = true

# macOS Keychain custody for the Claude OAuth broker lives only on macOS. The
# crate owns any FFI through `security-framework`'s safe wrappers, so this
# composes with the workspace `unsafe_code = forbid` lint.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
